name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cloud/requirements*.txt
      - run: pip install -r services/cloud/requirements-dev.txt
      - run: ruff check services/cloud services/inference/src/model.py scripts
      - run: pytest -q
      - run: pip check
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
      - run: terraform -chdir=infra/google fmt -check
      - run: terraform -chdir=infra/google init -backend=false -input=false
      - run: terraform -chdir=infra/google validate
